<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Bài tập Chương 6 Tư tưởng Hồ Chí Minh: văn hóa, đạo đức, con người. Biên soạn: TS. Bùi Văn Như">
<meta name="author" content="TS. Bùi Văn Như">
<title>Trồng Người Trăm Năm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Playfair+Display:ital,wght@0,700;1,500&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EDF1EC; --surface:#FFFFFF; --surface2:#E1E9E2; --ink:#14261E; --muted:#56655D;
  --line:#C9D4CB; --red:#1D6B4E; --red-ink:#FFFFFF; --gold:#B8841A; --gold-soft:#F3E6C4;
  --ok:#1F7A4D; --ok-soft:#DCF0E3; --bad:#B23A2E; --bad-soft:#F7E0DC;
  --display:"Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1613; --surface:#17211C; --surface2:#1F2C25; --ink:#E8EEE9; --muted:#9DB0A5;
    --line:#2E3E35; --red:#4FBF8E; --red-ink:#0B1A13; --gold:#E3B54E; --gold-soft:#342C18;
    --ok:#5CCB93; --ok-soft:#15301F; --bad:#F07366; --bad-soft:#3A1E1B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#17211C; --surface2:#1F2C25; --ink:#E8EEE9; --muted:#9DB0A5;
  --line:#2E3E35; --red:#4FBF8E; --red-ink:#0B1A13; --gold:#E3B54E; --gold-soft:#342C18;
  --ok:#5CCB93; --ok-soft:#15301F; --bad:#F07366; --bad-soft:#3A1E1B; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:860px;margin:0 auto}
header.hero{padding-block:28px 18px;display:grid;gap:10px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.slogan{font-family:var(--display);font-weight:700;text-transform:uppercase;line-height:1.02;font-size:clamp(34px,7.5vw,64px);margin:0;letter-spacing:.01em;text-wrap:balance}
.slogan .l1{display:block;color:var(--ink)}
.slogan .l2{display:block;color:var(--red)}
.quote{margin:8px 0 6px;position:relative;container-type:inline-size;padding-block:14px 10px;border-block:1px solid var(--line)}
.sprout{display:block;margin:0 auto 6px;width:54px;height:40px;color:var(--red)}
.quote .qmark{position:absolute;top:-28px;left:-4px;font-family:"Playfair Display",Georgia,serif;font-size:96px;line-height:1;color:var(--gold);opacity:.55}
.quote blockquote{margin:0;display:grid;gap:.1em;font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-weight:700;line-height:1.2;text-align:center;font-size:min(5.1cqi,46px)}
.quote .ql{display:block;white-space:nowrap;color:var(--ink)}
.quote .ql2{color:var(--red);font-style:italic;font-weight:500}
.quote figcaption{text-align:right;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:10px}
.quote figcaption::before{content:"— "}
.sub{color:var(--muted);max-width:62ch;margin:0}
.score{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.chip b{color:var(--red)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;gap:6px;overflow-x:auto;border-bottom:2px solid var(--ink);scrollbar-width:none}
nav.tabs button{flex:0 0 auto;font-family:var(--display);font-weight:500;font-size:15px;text-transform:uppercase;letter-spacing:.04em;border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:6px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav.tabs button:focus-visible,.btn:focus-visible,.opt:focus-visible,.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
section.panel{padding-top:22px;display:grid;gap:16px}
h2{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:26px;margin:0;letter-spacing:.02em}
.lead{color:var(--muted);margin:0;max-width:65ch}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.lv{padding:2px 8px;border-radius:4px;font-weight:700;letter-spacing:.04em}
.lv-NB{background:var(--surface2);color:var(--ink)}
.lv-TH{background:var(--gold-soft);color:var(--ink)}
.lv-VD{background:var(--ok-soft);color:var(--ok)}
.lv-VDC{background:var(--bad-soft);color:var(--bad)}
.pg{margin-left:auto;font-variant-numeric:tabular-nums}
.qtext{font-size:18px;font-weight:600;margin:0;line-height:1.45}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{font-family:var(--display);font-weight:700;min-width:20px;color:var(--muted)}
.opt.sel{border-color:var(--ink);background:var(--surface2)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.exp{border-left:4px solid var(--gold);background:var(--surface2);padding:10px 12px;border-radius:0 6px 6px 0;font-size:15px}
.exp strong{display:block;margin-bottom:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 16px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn[disabled]{opacity:.45;cursor:default}
.progress{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--red);transition:width .3s}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{font:inherit;font-size:13px;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.fill-q{font-size:18px;font-weight:500;margin:0}
.blank{display:inline-block;min-width:90px;border-bottom:2px solid var(--red);text-align:center;font-weight:700;color:var(--red);padding:0 4px}
.words{display:flex;flex-wrap:wrap;gap:8px}
/* timeline */
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.bins .opt{justify-content:center;align-items:center;min-height:52px;text-align:center;font-family:var(--display);font-size:17px;font-weight:500;text-transform:uppercase;letter-spacing:.03em}
.sortcard{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:21px;line-height:1.4;padding:10px 4px;text-align:center;text-wrap:balance}
.tl{display:grid;gap:8px}
.slot{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;min-height:48px;border:1.5px dashed var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.slot .n{font-family:var(--display);font-size:20px;color:var(--muted);text-align:center}
.slot.filled{border-style:solid;border-color:var(--ink)}
.slot.right{border-color:var(--ok);background:var(--ok-soft)}
.slot.wrong{border-color:var(--bad);background:var(--bad-soft)}
.slot .yr{font-family:var(--display);font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.card{font:inherit;font-size:14px;font-weight:600;text-align:left;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
.card:hover{background:var(--surface2)}
/* TF */
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfbtns .opt{justify-content:center;font-family:var(--display);font-size:20px;text-transform:uppercase;font-weight:700}
/* exam */
.timer{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.result{background:var(--ink);color:var(--bg);border-radius:10px;padding:20px;display:grid;gap:6px}
.result .big{font-family:var(--display);font-size:56px;line-height:1;font-weight:700}
.result .big span{color:var(--gold)}
.review{display:grid;gap:10px}
.review .item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:15px}
.review .item .a{color:var(--ok);font-weight:600}
.review .item .y{color:var(--bad)}
/* cases */
.case{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:10px}
.case h3{margin:0;font-size:19px}
.case .tag{font-family:var(--display);color:var(--red);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.case ol,.case ul{margin:0;padding-left:22px;display:grid;gap:4px}
details summary{cursor:pointer;font-weight:600;color:var(--red)}
details[open] summary{margin-bottom:8px}
.note{font-size:13px;color:var(--muted)}
footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
nav.tabs .fsbtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);color:var(--ink)}
nav.tabs .fsbtn[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--red-ink)}
body.focus header.hero,body.focus footer{display:none}
body.focus .wrap{max-width:1100px}
body.focus nav.tabs{padding-top:14px}
body.focus section.panel{padding-top:28px;gap:20px}
body.focus h2{font-size:32px}
body.focus .qbox{padding:28px}
body.focus .qtext,body.focus .fill-q{font-size:clamp(20px,2.4vw,30px)}
body.focus .opt{font-size:clamp(16px,1.7vw,22px);padding:14px 16px}
body.focus .card{font-size:clamp(14px,1.4vw,18px)}
body.focus .exp{font-size:clamp(15px,1.4vw,19px)}
body.focus .timer{font-size:32px}

/* ---- Chapter 6 visual layer ---- */
:root{--hero1:#0A3A2C;--hero2:#15664C;--hero-ink:#F5F0E3;--hero-soft:#BFD8C9;--hero-gold:#EBC057;
  --t-gold:#B07B12;--t-gold-bg:#FBF1D9;--t-jade:#15714F;--t-jade-bg:#DDF1E6;--t-coral:#C0512C;--t-coral-bg:#FBE4DA;--t-blue:#265E8A;--t-blue-bg:#DDEAF5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hero1:#082A20;--hero2:#114D3A;
  --t-gold:#E9BE5C;--t-gold-bg:#2E2614;--t-jade:#5ACB98;--t-jade-bg:#12291E;--t-coral:#F08A63;--t-coral-bg:#34201A;--t-blue:#7FB5E0;--t-blue-bg:#16232F}}
:root[data-theme="dark"]{--hero1:#082A20;--hero2:#114D3A;
  --t-gold:#E9BE5C;--t-gold-bg:#2E2614;--t-jade:#5ACB98;--t-jade-bg:#12291E;--t-coral:#F08A63;--t-coral-bg:#34201A;--t-blue:#7FB5E0;--t-blue-bg:#16232F}
header.hero{padding-block:20px 16px;gap:14px}
.hero-band{position:relative;overflow:hidden;border-radius:18px;padding:22px 22px 18px;color:var(--hero-ink);
  background:radial-gradient(120% 90% at 100% 0%,rgba(235,192,87,.22),transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(120,210,170,.18),transparent 60%),linear-gradient(135deg,var(--hero1),var(--hero2));
  box-shadow:0 18px 40px -22px rgba(10,58,44,.7)}
.hero-band::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:14px 14px;pointer-events:none}
.hero-band>*{position:relative;z-index:1}
.hero-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;align-items:baseline}
.hero-band .eyebrow{color:var(--hero-gold)}
.hero-topic{font-family:var(--display);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--hero-soft)}
.hero-band .quote{border-block:1px solid rgba(245,240,227,.22);margin:16px 0 4px}
.hero-band .qmark{color:var(--hero-gold);opacity:.7}
.hero-band .sprout{color:var(--hero-gold)}
.hero-band .ql{color:var(--hero-ink)}
.hero-band .ql2{color:var(--hero-gold)}
.hero-band .quote figcaption{color:var(--hero-soft)}
.author{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:12px;font-size:14px}
.author div{display:grid;gap:1px}
.author span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--hero-soft);font-weight:600}
.author b{font-weight:600;color:var(--hero-ink)}
nav.tabs button[aria-selected="true"]{background:var(--red);color:var(--red-ink)}
nav.tabs{border-bottom-color:var(--red)}
.progress i{background:linear-gradient(90deg,var(--red),var(--gold))}
.result{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:var(--hero-ink)}
.result .big span{color:var(--hero-gold)}
.lv-NB{background:var(--t-blue-bg);color:var(--t-blue)}
.lv-TH{background:var(--t-gold-bg);color:var(--t-gold)}
.lv-VD{background:var(--t-jade-bg);color:var(--t-jade)}
.lv-VDC{background:var(--t-coral-bg);color:var(--t-coral)}
.qbox{box-shadow:0 10px 30px -24px rgba(10,58,44,.55)}
/* summary */
.sum-lead{font-size:17px;line-height:1.65;max-width:70ch;margin:0}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.keys span{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.pillar{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pillar-head{display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--tb);color:var(--tc);border-bottom:1px solid var(--line)}
.pillar-head .num{font-family:"Playfair Display",Georgia,serif;font-size:34px;font-weight:700;line-height:1}
.pillar-head h3{margin:0;font-family:var(--display);font-weight:500;font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.pillar-body{padding:14px 18px 18px;display:grid;gap:14px}
.pillar-body h4{margin:0 0 4px;font-size:15px;color:var(--tc)}
.pillar-body ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:15px;line-height:1.5}
.pillar-body li::marker{color:var(--tc)}
.tone-gold{--tc:var(--t-gold);--tb:var(--t-gold-bg)}
.tone-jade{--tc:var(--t-jade);--tb:var(--t-jade-bg)}
.tone-coral{--tc:var(--t-coral);--tb:var(--t-coral-bg)}
.tone-blue{--tc:var(--t-blue);--tb:var(--t-blue-bg)}
nav.tabs .fsbtn{background:var(--gold);border-color:var(--gold);color:#1B1405;font-weight:600;box-shadow:0 6px 16px -8px var(--gold)}
nav.tabs .fsbtn:hover{filter:brightness(1.06)}
nav.tabs .fsbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);box-shadow:none}
nav.tabs{overflow:visible;align-items:center;gap:10px}
.tablist{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent);padding-right:24px}
.tablist::-webkit-scrollbar{display:none}
nav.tabs .fsbtn{margin-left:0;flex:0 0 auto}
@media (max-width:560px){nav.tabs .fsbtn span{display:none}nav.tabs .fsbtn{padding:8px 10px}}
/* ---- Pink hero + chapter title ---- */
:root{--bg:#FBF3F4;--surface2:#F6E6EA;--line:#EBD4DA;--hp1:#FFF4F6;--hp2:#F9D9E1;--hp-ink:#3B1C25;--hp-muted:#8C5A68;--hp-acc:#1A6A4C;--hp-gold:#A8740F;--hp-line:rgba(120,50,70,.18);--hp-hi:rgba(255,255,255,.7)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161113;--surface2:#261C20;--line:#3B2C32;--hp1:#2A1A20;--hp2:#3D2530;--hp-ink:#FBEAEE;--hp-muted:#D7AEB9;--hp-acc:#5ACB98;--hp-gold:#EBC057;--hp-line:rgba(255,220,230,.18);--hp-hi:rgba(255,200,215,.07)}}
:root[data-theme="dark"]{--bg:#161113;--surface2:#261C20;--line:#3B2C32;--hp1:#2A1A20;--hp2:#3D2530;--hp-ink:#FBEAEE;--hp-muted:#D7AEB9;--hp-acc:#5ACB98;--hp-gold:#EBC057;--hp-line:rgba(255,220,230,.18);--hp-hi:rgba(255,200,215,.07)}
body{background:var(--bg)}
nav.tabs{background:var(--bg)}
.hero-band{color:var(--hp-ink);background:radial-gradient(90% 80% at 100% 0%,var(--hp-hi),transparent 60%),radial-gradient(80% 90% at 0% 100%,rgba(240,160,180,.35),transparent 60%),linear-gradient(135deg,var(--hp1),var(--hp2));box-shadow:0 20px 44px -26px rgba(140,60,80,.55);border:1px solid var(--hp-line);padding:26px 26px 20px}
.hero-band::after{background-image:radial-gradient(rgba(160,70,95,.10) 1px,transparent 1px)}
.hero-top{justify-content:space-between}
.hero-band .eyebrow{color:var(--hp-muted)}
.hero-band .chap{font-family:var(--display);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--hp-acc);padding:3px 12px;border-radius:999px}
.chap-title{margin:14px auto 4px;max-width:32ch;text-align:center;font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:1.14;font-size:clamp(24px,4.4vw,46px);color:var(--hp-acc);text-wrap:balance}
.hero-band .quote{border-block:1px solid var(--hp-line);margin:14px auto 4px;max-width:720px;padding-block:12px 8px}
.hero-band .quote blockquote{font-size:clamp(15px,3.4cqi,23px)}
.hero-band .qmark{color:var(--hp-gold);opacity:.55;font-size:64px;top:-18px}
.hero-band .sprout{color:var(--hp-gold);width:40px;height:30px}
.hero-band .ql{color:var(--hp-ink)}
.hero-band .ql2{color:var(--hp-acc)}
.hero-band .quote figcaption{color:var(--hp-muted)}
.author span{color:var(--hp-muted)}
.author b{color:var(--hp-ink)}
.author{justify-content:center;border-top:1px solid var(--hp-line);padding-top:12px}
@media (max-width:560px){.hero-band{padding:20px 18px 16px}.hero-band .ql{white-space:normal;text-wrap:balance}}
.author div{text-align:center}
.pillar-body li b{font-weight:800;color:var(--tc);background:linear-gradient(transparent 62%,color-mix(in srgb,var(--tc) 16%,transparent) 62%);padding:0 2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<body>
<div id="lockGate" style="--gacc:#1A6A4C">
<style>
#lockGate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:16px;background:radial-gradient(80% 70% at 50% 0%,color-mix(in srgb,var(--gacc) 35%,#fff) ,#F4F4F6 70%);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#1A1A22}
@media (prefers-color-scheme:dark){#lockGate{background:radial-gradient(80% 70% at 50% 0%,color-mix(in srgb,var(--gacc) 45%,#000),#101014 70%);color:#F1F1F5}#lockGate .gcard{background:#1B1B22;border-color:#33333d}#lockGate input{background:#111116;color:#F1F1F5;border-color:#3a3a46}#lockGate .gsub,#lockGate .gnote{color:#B5B5C4}}
#lockGate .gcard{width:min(440px,100%);background:#fff;border:1px solid #E3E3EA;border-radius:18px;padding:28px 24px;box-shadow:0 30px 60px -30px rgba(0,0,0,.45);display:grid;gap:14px;text-align:center}
#lockGate .gic{width:58px;height:58px;margin:0 auto;border-radius:16px;display:grid;place-items:center;background:var(--gacc);color:#fff}
#lockGate .gch{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--gacc)}
#lockGate h1{margin:0;font-size:20px;line-height:1.3}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const norm=p=>p.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/[^a-z0-9]/g,"");
async function open(pw){
 const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(norm(pw)),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:150000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
 const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.c));
 return new TextDecoder().decode(pt);
}
function mount(html){
 const app=document.getElementById("lockApp");app.innerHTML=html;
 app.querySelectorAll("script").forEach(old=>{const s=document.createElement("script");s.textContent=old.textContent;old.replaceWith(s);});
 document.getElementById("lockGate").remove();
}
async function tryPw(pw,silent){
 const btn=document.getElementById("gBtn"),err=document.getElementById("gErr");
 btn.disabled=true;btn.textContent="Đang mở…";err.textContent="";
 try{const html=await open(pw);
  try{if(document.getElementById("gRem").checked)localStorage.setItem(K,pw);else localStorage.removeItem(K);}catch(e){}
  mount(html);
 }catch(e){btn.disabled=false;btn.textContent="Vào bài học";if(!silent){err.textContent="Mật khẩu chưa đúng. Vui lòng thử lại.";const i=document.getElementById("gPw");i.select();}}
}
document.getElementById("gForm").addEventListener("submit",e=>{e.preventDefault();tryPw(document.getElementById("gPw").value,false);});
if(!(window.crypto&&crypto.subtle)){document.getElementById("gErr").textContent="Trình duyệt không hỗ trợ mở khóa. Hãy mở trang qua địa chỉ https (ví dụ GitHub Pages) bằng Chrome, Edge, Safari hoặc Firefox bản mới.";}
else{let saved=null;try{saved=localStorage.getItem(K);}catch(e){}if(saved)tryPw(saved,true);}
})();
